name: Reporte de error
description: Algo no funciona como se espera
labels: [bug]
body:
  - type: textarea
    id: que-paso
    attributes:
      label: Qué pasó y qué esperabas
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      placeholder: "1. node install.mjs --project\n2. ..."
    validations:
      required: true
  - type: input
    id: entorno
    attributes:
      label: Entorno
      placeholder: "Windows 11 + Git Bash · Node 24.x · Claude Code 2.1.x · plan Max"
    validations:
      required: true
  - type: textarea
    id: salida
    attributes:
      label: Salida o errores
      description: Pega la salida del instalador o del hook. Quita rutas o datos personales.
      render: text
