name: Propuesta de mejora
description: Sugiere una mejora o una nueva capacidad
labels: [enhancement]
body:
  - type: textarea
    id: problema
    attributes:
      label: Qué problema resuelve
    validations:
      required: true
  - type: textarea
    id: propuesta
    attributes:
      label: Propuesta
      description: Ten en cuenta las reglas de AGENTS.md (cero dependencias, decide la persona, fallar de forma segura).
    validations:
      required: true
